name: Keep Render Instance Alive

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          echo "Pinging render health endpoint..."
          curl -sf -o /dev/null -w "%{http_code}" \
            https://thepictory.onrender.com/health || echo "Failed"
